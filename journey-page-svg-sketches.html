<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journey page — all-SVG stage (sketch)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
  :root{
    --background:#ffffff;
    --border:#e8e8e8;
    --foreground:#0a0a0a;
    --muted-foreground:#6b6b6b;
    --warm:#c98a3a;
    --warm-soft:#e8b87e;
    --wash-ochre:#ffecdb;
    --deep-ochre:#96600a;
    --ochre-line:#e9c9a6;      /* a drawn road on the ochre ground */
    --ochre-gate:#f6dcc0;       /* the phase-gate chip fill */
    --ease-out-expo:cubic-bezier(.16,1,.3,1);
    --ease-hover:cubic-bezier(.2,.7,.35,1);
    --hover-dur:.18s;
    --hover-scale:1.08;
    --ground:var(--wash-ochre);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:auto;}
  body{
    margin:0;background:var(--ground);color:var(--foreground);
    font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .micro{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    font-weight:600;color:var(--muted-foreground);margin:0;
  }
  .page-title{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;
    font-variation-settings:"opsz" 96;font-weight:500;letter-spacing:-.01em;line-height:.98;
    font-size:clamp(46px,9vw,96px);text-transform:uppercase;margin:0;
  }
  .page-lead{margin:12px 0 0;font-size:clamp(16px,2vw,21px);color:var(--muted-foreground);line-height:1.35;max-width:30ch;}
  .card-hint{display:flex;width:fit-content;align-items:center;gap:9px;margin:18px 0 0;color:var(--deep-ochre);font-size:13px;}
  .card-hint svg{width:15px;height:15px;flex:0 0 auto;}
  .link{
    color:var(--deep-ochre);text-decoration:none;border-bottom:1px solid color-mix(in oklab,var(--deep-ochre),transparent 55%);
    transition:color var(--hover-dur) var(--ease-hover),border-color var(--hover-dur) var(--ease-hover),scale var(--hover-dur) var(--ease-hover);
    display:inline-block;
  }
  @media (hover:hover){.link:hover{color:var(--warm);border-color:var(--warm);scale:var(--hover-scale);}}

  /* ---------- the stage + flow (the arch/skills mould) ---------- */
  .stageScroll{position:relative;}
  .stage{position:sticky;top:0;height:100vh;height:100svh;z-index:0;}
  .jMap{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}

  .flow{position:relative;margin-top:-100vh;margin-top:-100svh;pointer-events:none;}
  .flow a{pointer-events:auto;}
  .block{
    min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
    padding:110px clamp(36px,6vw,90px) 110px 56%;
  }
  .blockHead{
    justify-content:flex-start;
    padding:clamp(96px,15vh,150px) 0 0 clamp(24px,6vw,86px);
  }
  .blockEnd{justify-content:center;}
  .k{margin:0 0 12px;}
  .kOchre{color:var(--deep-ochre);}
  .jTitle{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;font-variation-settings:"opsz" 48;
    font-weight:500;letter-spacing:-.01em;line-height:1.02;font-size:clamp(30px,3.2vw,46px);margin:0;
  }
  .jSummary{margin:14px 0 22px;font-size:17px;color:var(--muted-foreground);line-height:1.5;max-width:40ch;}
  .jEv{display:flex;flex-direction:column;gap:9px;align-items:flex-start;}
  .jEv .link{font-size:13.5px;}
  .jEv .w{color:var(--muted-foreground);}
  .endLine{font-style:italic;color:var(--muted-foreground);font-size:18px;margin:0;max-width:30ch;}

  /* phase chapter card (reading column) — editorial: big at a LIGHT weight, no box */
  .chapNum{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;font-variation-settings:"opsz" 96;
    font-weight:400;font-size:clamp(46px,6vw,92px);line-height:.86;letter-spacing:-.02em;
    color:var(--deep-ochre);margin:0 0 4px;
  }
  .chapTitle{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;font-variation-settings:"opsz" 72;
    font-weight:400;letter-spacing:-.015em;line-height:1.0;font-size:clamp(38px,4.6vw,68px);margin:0;max-width:16ch;
  }
  .chapMeta{margin:18px 0 0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-foreground);font-weight:600;}

  /* ---------- the SVG diagram ---------- */
  .jMap .road{fill:none;stroke:var(--ochre-line);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  /* the travelling stroke: the stretch of road already walked, drawn to the comet head */
  .jMap .roadLit{fill:none;stroke:var(--warm);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;}
  .jMap .tail{fill:none;stroke:var(--ochre-line);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:2 11;opacity:.7;}
  /* the comet head (a small point) + its soft halo RING, riding the lit stroke's tip */
  .jMap .jHalo{fill:none;stroke:var(--warm);stroke-width:1.6;pointer-events:none;}
  .jMap .jHead{fill:var(--deep-ochre);pointer-events:none;}
  /* milestone bloom ring — rings out the instant the head reaches a waypoint */
  .jMap .ring{fill:none;stroke:var(--warm);stroke-width:1.6;pointer-events:none;opacity:0;}
  /* entry pins */
  .jMap .pin{cursor:pointer;}
  .jMap .pinDot{fill:var(--ground);stroke:var(--foreground);stroke-width:2;transition:fill var(--hover-dur) var(--ease-hover),stroke var(--hover-dur) var(--ease-hover);}
  .jMap .pin.on .pinDot{fill:var(--ground);stroke:var(--deep-ochre);stroke-width:2.6;}
  .jMap .pinT{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;font-variation-settings:"opsz" 18;
    font-weight:500;letter-spacing:-.005em;fill:var(--foreground);
  }
  .jMap .pinD{font-family:"Outfit",sans-serif;font-size:11px;letter-spacing:.14em;font-weight:600;fill:var(--muted-foreground);text-transform:uppercase;}
  /* phase gate — an open editorial milestone, no filled block */
  .jMap .gateRingO{fill:none;stroke:var(--deep-ochre);stroke-width:1.2;opacity:.38;transition:opacity var(--hover-dur) var(--ease-hover);}
  .jMap .gateRing{fill:var(--ground);stroke:var(--deep-ochre);stroke-width:1.8;}
  .jMap .gateTag{font-family:"Outfit",sans-serif;font-size:12px;letter-spacing:.26em;font-weight:700;fill:var(--muted-foreground);text-transform:uppercase;transition:fill var(--hover-dur) var(--ease-hover);}
  .jMap .gate.on .gateRingO{opacity:.72;}
  .jMap .gate.on .gateTag{fill:var(--deep-ochre);}

  /* ---------- the mode toggle (sketch chrome only) ---------- */
  .toggle{
    position:fixed;top:16px;right:16px;z-index:50;display:flex;gap:2px;
    background:#fff;border:1px solid var(--border);border-radius:999px;padding:3px;
    box-shadow:0 6px 24px rgba(0,0,0,.08);font-size:13px;pointer-events:auto;
  }
  .toggle button{
    appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted-foreground);
    font:inherit;font-weight:600;padding:6px 16px;border-radius:999px;transition:.2s var(--ease-out-expo);
  }
  .toggle button.on{background:var(--wash-ochre);color:var(--deep-ochre);}
  /* page masthead — title + subtitle pinned top-left */
  .masthead{position:fixed;top:clamp(20px,4vh,40px);left:clamp(24px,6vw,86px);z-index:40;pointer-events:none;}
  .mh-title{
    font-family:"Bodoni Moda",Georgia,serif;font-optical-sizing:auto;font-variation-settings:"opsz" 96;
    font-weight:500;letter-spacing:-.02em;line-height:.92;font-size:clamp(46px,9vw,96px);
    text-transform:uppercase;margin:0;color:var(--foreground);
  }
  .mh-sub{margin:12px 0 0;font-size:clamp(16px,2vw,21px);color:var(--muted-foreground);}
  .note{position:fixed;bottom:14px;left:16px;z-index:50;font-size:11.5px;color:var(--muted-foreground);max-width:44ch;line-height:1.4;pointer-events:none;
    background:rgba(255,246,236,.82);backdrop-filter:blur(2px);padding:9px 13px;border-radius:8px;border:1px solid rgba(150,96,10,.12);}

  /* ---------- portrait: stage holds the top, reading runs under ---------- */
  @media (max-width:720px),(max-aspect-ratio:9/10){
    .stage{z-index:2;pointer-events:none;}
    .jMap{top:7%;height:46%;z-index:1;pointer-events:auto;}
    .flow{}
    .block{min-height:0;justify-content:flex-start;padding:52vh clamp(22px,6vw,40px) 30vh;}
    .blockHead{min-height:84vh;padding:clamp(80px,13vh,150px) clamp(22px,6vw,40px) 0;position:relative;z-index:3;}
  }
</style>
</head>
<body>

<div class="masthead">
  <h1 class="mh-title">The Journey</h1>
  <p class="mh-sub">Roads not taken</p>
</div>

<p class="note">Sketch · the <b>whole diagram is one <code>viewBox</code> SVG</b> (scales to any screen). A scroll-camera walks the road; the <b>travelling stroke + comet head stay locked to the active entry</b>, and each dot rings out the instant the head reaches it. Phase names are editorial chapter cards.</p>

<div class="stageScroll" id="stageScroll">
  <div class="stage">
    <svg id="jMap" class="jMap" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  </div>
  <div class="flow" id="flow"></div>
</div>

<script>
/* ============================ content (real journey.json, oldest→newest, grouped by phase) ============================ */
const PHASES = [
  {key:"Phase 0", title:"Planning"},
  {key:"Phase 1", title:"Serving live"},
  {key:"Phase 2", title:"Automation & gates"},
  {key:"Phase 3", title:"Ephemeral Kubernetes"},
  {key:"Phase 4", title:"Monitoring"},
];
const ENTRIES = [
  {slug:"guardrails-before-resources",date:"2026-07-03",phaseKey:"Phase 0",title:"Guardrails before resources",summary:"Budgets and spend alerts were set up before any infrastructure.",
   ev:[{l:"the persistent infra",h:"https://github.com/MonishKamwal/mlops/tree/main/infra/persistent"},{l:"provider-wide cost tags",h:"https://github.com/MonishKamwal/mlops/blob/main/infra/persistent/providers.tf"}]},
  {slug:"one-preprocessing-path",date:"2026-07-03",phaseKey:"Phase 1",title:"One preprocessing path",summary:"Training and serving can prepare inputs slightly differently; one shared path prevents it.",
   ev:[{l:"the shared preprocessing",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/data/preprocess.py"},{l:"the serving predictor",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/serving/predictor.py"}]},
  {slug:"the-model-is-the-easy-part",date:"2026-07-04",phaseKey:"Phase 1",title:"The model is the easy part",summary:"A small CNN reached the accuracy target quickly; the work was everything around it.",
   ev:[{l:"the confusion matrix",h:"https://monishkamwal.github.io/mlops/confusion_matrix.png"},{l:"the training code",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/training/train.py"}]},
  {slug:"the-freeze-changes-the-design",date:"2026-07-06",phaseKey:"Phase 1",title:"The freeze that changes how you log",summary:"The serving function freezes the moment it replies, which rules out background logging.",
   ev:[{l:"the prediction log",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/serving/prediction_log.py"},{l:"the append-only IAM",h:"https://github.com/MonishKamwal/mlops/blob/main/infra/persistent/iam.tf"}]},
  {slug:"one-bucket-three-jobs",date:"2026-07-18",phaseKey:"Phase 2",title:"One bucket, three jobs",summary:"The dataset, the model registry, and the evidence all share one S3 bucket.",
   ev:[{l:"the one bucket",h:"https://github.com/MonishKamwal/mlops/blob/main/infra/persistent/s3.tf"},{l:"the DVC pipeline",h:"https://github.com/MonishKamwal/mlops/blob/main/dvc.yaml"}]},
  {slug:"pandera-at-the-door",date:"2026-07-18",phaseKey:"Phase 2",title:"Pandera at the door",summary:"A schema checks the data before it can reach training.",
   ev:[{l:"the validation stage",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/data/validate.py"},{l:"the DVC pipeline",h:"https://github.com/MonishKamwal/mlops/blob/main/dvc.yaml"}]},
  {slug:"no-keys-anywhere",date:"2026-07-20",phaseKey:"Phase 2",title:"No keys anywhere",summary:"Deploys run without any long-lived cloud credentials stored in the repo.",
   ev:[{l:"the deploy workflow",h:"https://github.com/MonishKamwal/mlops/blob/main/.github/workflows/train-deploy.yml"},{l:"the trust policy",h:"https://github.com/MonishKamwal/mlops/blob/main/infra/persistent/iam.tf"}]},
  {slug:"the-gate-that-says-no",date:"2026-07-20",phaseKey:"Phase 2",title:"The gate that says no",summary:"A CI gate blocks a new model from shipping if it regresses against the current best.",
   ev:[{l:"the blocked-deploy run",h:"https://github.com/MonishKamwal/mlops/actions/runs/29757829275"},{l:"gate.py",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/training/gate.py"}]},
  {slug:"control-plane-is-not-eks",date:"2026-07-22",phaseKey:"Phase 3",title:"A smoke test that proved nothing",summary:"An early check skipped the part the free plan actually restricts, so it cleared nothing.",
   ev:[{l:"a full rehearsal run",h:"https://github.com/MonishKamwal/mlops/actions/runs/29970873573"},{l:"the EKS Terraform",h:"https://github.com/MonishKamwal/mlops/tree/main/infra/ephemeral"}]},
  {slug:"evidence-from-the-source-of-truth",date:"2026-07-21",phaseKey:"Phase 4",title:"Evidence from the registry, not a saved file",summary:"The evidence hub reads the model registry, so it can't show a number that's no longer current.",
   ev:[{l:"the evidence exporter",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/evidence/export.py"},{l:"the live evidence hub",h:"https://monishkamwal.github.io/mlops/"}]},
  {slug:"when-the-drift-report-lied",date:"2026-07-23",phaseKey:"Phase 4",title:"A drift report that read backwards",summary:"The drift library changes method with sample size, and the result was being read the wrong way.",
   ev:[{l:"the drift report code",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/monitoring/drift.py"},{l:"this week's drift.json",h:"https://monishkamwal.github.io/mlops/drift.json"}]},
  {slug:"the-retrain-flywheel",date:"2026-07-24",phaseKey:"Phase 4",title:"The retrain flywheel, end to end",summary:"A graded drawing becomes training data, and an opt-in run folds it back into the model.",
   ev:[{l:"the flywheel run, end to end",h:"https://github.com/MonishKamwal/mlops/actions/runs/30061303377"},{l:"the augment step",h:"https://github.com/MonishKamwal/mlops/blob/main/src/quickdraw/training/augment.py"}]},
];

/* group by phase (declared order), entries within sorted oldest-first, drop empty phases */
const GROUPS = PHASES.map(ph=>({ph, items:ENTRIES.filter(e=>e.phaseKey===ph.key).sort((a,b)=>a.date.localeCompare(b.date))})).filter(g=>g.items.length);
const ORDERED = GROUPS.flatMap(g=>g.items);          // entries in page order
const fmtDate = d=>{const [y,m,dd]=d.split("-");return new Date(+y,+m-1,+dd).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});};

/* ============================ geometry: the winding road (plan units) ============================ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=v=>{v=clamp(v,0,1);return v*v*(3-2*v);};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function buildRoad(){
  const vbw=1000, LX=322, RX=678;
  const GATE_TO_ENTRY=178, ENTRY_TO_ENTRY=212, ENTRY_TO_GATE=252, TOP=150, TAIL=250;
  const nodes=[], gates=[];
  let y=TOP, side=0, first=true, idx=0;
  GROUPS.forEach((g,gi)=>{
    const gy = first ? TOP : y + ENTRY_TO_GATE;
    gates.push({gi, key:g.ph.key, title:g.ph.title, y:gy, grp:g});
    g.items.forEach((e,ei)=>{
      const ny = ei===0 ? gy + GATE_TO_ENTRY : y + ENTRY_TO_ENTRY;
      nodes.push({x: side%2===0?LX:RX, y:ny, side: side%2===0?"L":"R", e, idx});
      y=ny; side++; idx++;
    });
    first=false;
  });
  const vbh = y + TAIL;
  // smooth serpentine through [centre-top start, ...nodes] — vertical handles
  const chain=[{x:vbw/2,y:gates[0].y}, ...nodes];
  let d=`M ${chain[0].x} ${chain[0].y}`;
  for(let i=1;i<chain.length;i++){const a=chain[i-1],b=chain[i],m=(b.y-a.y)*.5;d+=` C ${a.x} ${(a.y+m).toFixed(1)}, ${b.x} ${(b.y-m).toFixed(1)}, ${b.x} ${b.y}`;}
  const last=nodes[nodes.length-1];
  const tailD=`M ${last.x} ${last.y} C ${last.x} ${last.y+90}, 470 ${last.y+150}, 500 ${last.y+220}`;
  return {vbw, vbh, d, tailD, nodes, gates};
}
const phaseMeta=g=>{const n=g.items.length;return `${n} decision${n>1?"s":""}`;};

/* ============================ the reading flow (head · chapter cards · entries · end) ============================ */
const flow=document.getElementById("flow");
function arrow(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;vertical-align:-1px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}
function buildFlow(){
  // No zoomed-out opening: the page lands directly in the Phase 0 "camera" state. Phase 0 is just
  // the first chapter card (carrying the journey kicker + scroll hint); every phase card behaves
  // the same — centred, then rolls up and fades into its entries.
  let h="";
  GROUPS.forEach((g,gi)=>{
    const num=g.ph.key.replace(/\D/g,"");
    h+= gi===0
      ? `<div class="block" data-stop>
      <p class="micro k kOchre">The Journey · Roads not taken</p>
      <p class="chapNum">${esc(num)}</p>
      <h2 class="chapTitle">${esc(g.ph.title)}</h2>
      <p class="chapMeta">Phase ${esc(num)} · ${esc(phaseMeta(g))}</p>
      <div class="card-hint" style="margin-top:20px">${arrow()} Scroll to walk the path — any entry opens the full story</div></div>`
      : `<div class="block chapter" data-stop>
      <p class="micro k kOchre">Phase</p>
      <p class="chapNum">${esc(num)}</p>
      <h2 class="chapTitle">${esc(g.ph.title)}</h2>
      <p class="chapMeta">${esc(phaseMeta(g))}</p></div>`;
    g.items.forEach(e=>{
      const ev=e.ev.map(x=>`<a class="link" href="${x.h}" target="_blank" rel="noopener">${esc(x.l)} ${arrow()}</a>`).join("");
      h+=`<div class="block" data-stop>
        <p class="micro k kOchre">${esc(fmtDate(e.date))} · ${esc(e.phaseKey)} — ${esc(PHASES.find(p=>p.key===e.phaseKey).title)}</p>
        <h2 class="jTitle">${esc(e.title)}</h2>
        <p class="jSummary">${esc(e.summary)}</p>
        <div class="jEv">${ev}</div></div>`;
    });
  });
  // the final stop carries no text — it exists only to pull the camera back and reveal
  // the unfinished tail fading off the road
  h+=`<div class="block blockEnd" data-stop aria-hidden="true"></div>`;
  flow.innerHTML=h;
}

/* ============================ the stage: scroll camera + synced comet + dot pulse ============================ */
const svg=document.getElementById("jMap");
let GEO=null, nodes=[], gates=[], geomPath=null, roadLit=null, jHead=null, jHalo=null;
let pins=[], blocks=[], anchors=[], stops=[], pathLen=0;
let nodeStop={}, gateStop={};
const RING_NEAR=0.032;   // how close (in path-fraction) the dot must be to an entry for its ring to show
const portMq=matchMedia("(max-aspect-ratio:9/10),(max-width:720px)");

function build(){
  GEO=buildRoad(); nodes=GEO.nodes; gates=GEO.gates;
  svg.setAttribute("viewBox",`0 0 ${GEO.vbw} ${GEO.vbh}`);

  // pass 1 — drop the bare road in, measure each waypoint's length-fraction along it
  svg.innerHTML=`<path class="road" d="${GEO.d}"/>`;
  geomPath=svg.querySelector(".road");
  pathLen=geomPath.getTotalLength();
  const N=720, samp=[];
  for(let k=0;k<=N;k++) samp.push(geomPath.getPointAtLength(pathLen*k/N));
  const fracNear=(x,y)=>{let bi=0,bd=1e9;for(let k=0;k<=N;k++){const dx=samp[k].x-x,dy=samp[k].y-y,dd=dx*dx+dy*dy;if(dd<bd){bd=dd;bi=k;}}return bi/N;};
  const fracAtY=y=>{let bi=0,bd=1e9;for(let k=0;k<=N;k++){const dy=Math.abs(samp[k].y-y);if(dy<bd){bd=dy;bi=k;}}return bi/N;};
  nodes.forEach(n=>{n.frac=fracNear(n.x,n.y);});
  gates.forEach(g=>{g.frac=fracAtY(g.y);const p=geomPath.getPointAtLength(g.frac*pathLen);g.x=p.x;g.y=p.y;});

  // pass 2 — assemble the full diagram now that every point is known. No phase markers
  // on the road: the phase names live only in the chapter cards.
  let s=`<path class="road" d="${GEO.d}"/><path class="tail" d="${GEO.tailD}"/>`;
  s+=`<path class="roadLit" d="${GEO.d}"/>`;
  nodes.forEach((n,i)=>{
    s+=`<g class="pin" data-pin="${i}" opacity="0"><circle class="pinDot" cx="${n.x}" cy="${n.y}" r="7"/></g>`;
  });
  // the travelling comet: a steady dot + a ring that blooms out of it only at the entries
  s+=`<circle class="jHalo" r="6" opacity="0"/><circle class="jHead" r="4" opacity="0"/>`;
  svg.innerHTML=s;

  geomPath=svg.querySelector(".road");
  roadLit=svg.querySelector(".roadLit");
  roadLit.style.strokeDasharray=pathLen.toFixed(2);
  roadLit.style.strokeDashoffset=pathLen.toFixed(2);
  jHead=svg.querySelector(".jHead"); jHalo=svg.querySelector(".jHalo");
  pins=[...svg.querySelectorAll(".pin")];

  // stops, 1:1 with the flow blocks: (gate, entries…) per phase → end. No separate zoomed-out
  // head stop — the page lands straight on the Phase 0 gate.
  stops=[];
  let ni=0;
  GROUPS.forEach((g,gi)=>{
    stops.push({kind:"gate", gi, x:gates[gi].x, y:gates[gi].y, frac:gates[gi].frac});
    g.items.forEach(()=>{ const n=nodes[ni]; stops.push({kind:"entry", ni, x:n.x, y:n.y, frac:n.frac}); ni++; });
  });
  const last=nodes[nodes.length-1];
  stops.push({kind:"end", x:last.x, y:last.y+150, frac:1});
  nodeStop={}; gateStop={};
  stops.forEach((st,si)=>{ if(st.kind==="entry") nodeStop[st.ni]=si; if(st.kind==="gate") gateStop[st.gi]=si; });

  // click a pin → scroll to its stop
  pins.forEach((p,k)=>p.addEventListener("click",()=>{ const si=nodeStop[k]; if(anchors[si]!=null) scrollTo({top:anchors[si],behavior:"smooth"}); }));
}

function layout(){
  blocks=[...flow.querySelectorAll("[data-stop]")];
  const vh=innerHeight, max=document.documentElement.scrollHeight-vh;
  let prev=0;
  anchors=blocks.map((b,i)=>{
    if(i===0) return 0;
    const top=b.getBoundingClientRect().top+scrollY;
    let a=clamp(top+b.offsetHeight/2-vh/2, prev+1, Math.max(prev+1,max));
    prev=a; return a;
  });
}

function cam(stop){
  const r=svg.getBoundingClientRect(), AR=r.width/Math.max(1,r.height), port=portMq.matches;
  const H=(stop.kind==="end"?(port?1180:1020):(port?770:630)), W=H*AR;   // road left, reading right
  const cx=port?stop.x:stop.x+W*0.16;
  return [cx-W/2, stop.y-H/2, W, H];
}
function setVB(a,b,e){
  const A=cam(a), B=cam(b);
  const W=Math.exp(Math.log(A[2])+(Math.log(B[2])-Math.log(A[2]))*e), AR=A[2]/A[3];
  const cxA=A[0]+A[2]/2, cyA=A[1]+A[3]/2, cxB=B[0]+B[2]/2, cyB=B[1]+B[3]/2;
  const cx=cxA+(cxB-cxA)*e, cy=cyA+(cyB-cyA)*e, H=W/AR;
  svg.setAttribute("viewBox",`${(cx-W/2).toFixed(1)} ${(cy-H/2).toFixed(1)} ${W.toFixed(1)} ${H.toFixed(1)}`);
}

function apply(){
  if(!anchors.length||!stops.length) return;
  const st=scrollY, an=anchors;
  let i=0; while(i<an.length-2 && st>=an[i+1]) i++;
  const seg=Math.max(1,an[i+1]-an[i]);
  const f=clamp((st-an[i])/seg,0,1);
  const e=smooth((f-0.08)/0.84);         // settles to 0 when a block is centred, 1 at the next
  const prog=i+e;
  setVB(stops[i],stops[i+1],e);

  // THE ORCHESTRATION: the comet's position along the road is the SAME progress that
  // selects the active text — mapped through each stop's measured path-fraction. So the
  // head sits exactly on a dot the instant that dot's text is centred.
  const headFrac=clamp(stops[i].frac + (stops[i+1].frac-stops[i].frac)*e, 0, 1);
  roadLit.style.strokeDashoffset=(pathLen*(1-headFrac)).toFixed(2);
  const hp=geomPath.getPointAtLength(headFrac*pathLen);
  const headOn=clamp((1.002-headFrac)/0.02,0,1);
  // the travelling dot stays a plain dot as it runs the road
  jHead.setAttribute("cx",hp.x.toFixed(1)); jHead.setAttribute("cy",hp.y.toFixed(1));
  jHead.setAttribute("opacity",headOn.toFixed(3));
  // the ring blooms OUT OF the dot as it nears an entry, is at max ON the entry, then shrinks
  // back into the dot as it leaves — driven by distance to the nearest entry, not time
  let dNear=1; for(const n of nodes){ const d=Math.abs(headFrac-n.frac); if(d<dNear) dNear=d; }
  const prox=clamp(1 - dNear/RING_NEAR, 0, 1);
  jHalo.setAttribute("cx",hp.x.toFixed(1)); jHalo.setAttribute("cy",hp.y.toFixed(1));
  jHalo.setAttribute("r",(6 + prox*12).toFixed(2));          // 6 (into the dot) → 18 (on the entry)
  jHalo.setAttribute("opacity",(headOn*prox*0.6).toFixed(3));

  // pins reveal as the head walks past; the active one hands its title to the reading column
  pins.forEach((p,k)=>{
    const n=nodes[k], op=clamp((headFrac-(n.frac-0.05))/0.04,0,1);
    p.setAttribute("opacity",op.toFixed(3));
    p.classList.toggle("on", Math.round(prog)===nodeStop[k]);
  });

  // reading column: fade the active block in, its neighbour out
  blocks.forEach((b,j)=>{
    let o;
    if(j===i) o=1-clamp((f-0.2)/0.3,0,1);
    else if(j===i+1) o=clamp((f-0.5)/0.3,0,1);
    else o=0;
    if(i===an.length-2 && j===an.length-1) o=1;   // hold the end card
    b.style.opacity=o.toFixed(3);
  });
}

/* ============================ boot ============================ */
buildFlow();
build();
layout();
(function loop(){ apply(); requestAnimationFrame(loop); })();
addEventListener("resize",()=>{ build(); layout(); });
if(document.fonts) document.fonts.ready.then(()=>{ build(); layout(); });
</script>
</body>
</html>
